version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: oncall-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oncall
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
