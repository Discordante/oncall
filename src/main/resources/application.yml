# ============================================================
# Oncall — Base application configuration
# ============================================================
spring:
  application:
    name: oncall

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # OAuth2 Resource Server — Google JWT validation
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com

# Google OAuth2 Client ID (from Google Cloud Console)
google:
  client-id: ${GOOGLE_CLIENT_ID:test-client-id}

# Telegram bot integration
telegram:
  bot:
    polling-enabled: true
    polling-interval-ms: 5000
    webhook-base-url: ${TELEGRAM_WEBHOOK_URL:}

# Actuator — solo exponer /health
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
  packages-to-scan: com.nextdigital.oncall.controller
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:test-client-id}
    use-pkce-with-authorization-code-grant: true
