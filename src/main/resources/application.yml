# ============================================================
# Oncall — Base application configuration
# ============================================================
spring:
  application:
    name: oncall

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # OAuth2 Resource Server — Google JWT validation
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
      # OAuth2 Client — Google login (proxied for the frontend SPA)
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email

# Google OAuth2 Client ID (from Google Cloud Console)
google:
  client-id: ${GOOGLE_CLIENT_ID:test-client-id}

# Frontend application URL (redirect target after OAuth2 login)
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

# Telegram bot integration
telegram:
  bot:
    polling-enabled: true
    polling-interval-ms: 5000
    webhook-base-url: ${TELEGRAM_WEBHOOK_URL:}

# Zadarma VoIP API integration
zadarma:
  api:
    key: ${ZADARMA_API_KEY:}
    secret: ${ZADARMA_API_SECRET:}
    base-url: https://api.zadarma.com
  redirect:
    retry-max-attempts: 10
    retry-initial-delay-seconds: 30
    fallback-check-interval-seconds: 300

# Actuator — solo exponer /health
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator

# SpringDoc OpenAPI
openapi:
  servers:
    - url: "http://localhost:8080"
      description: "Servidor de desarrollo local"
    - url: "https://api.oncall.nextdigital.com"
      description: "Servidor de producción"
    - url: "https://oncall-production-9337.up.railway.app"
      description: "Servidor en Railway (producción)"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
  packages-to-scan: com.nextdigital.oncall.controller
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:test-client-id}
    use-pkce-with-authorization-code-grant: true

# Auto-generación de turnos de guardia
oncall:
  shift-generation:
    enabled: true
    margin-weeks: 2
    coverage-weeks: 4
    cron: "0 0 3 * * ?"
    timezone: "Europe/Madrid"
    lookback-days: 90
