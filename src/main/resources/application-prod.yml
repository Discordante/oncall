# Oncall — Production profile
# ============================================================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Frontend URL for OAuth2 login redirect
app:
  frontend-url: ${APP_FRONTEND_URL}
